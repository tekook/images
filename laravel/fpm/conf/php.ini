; Applied on top of php.ini-production. Values come from the PHP_*
; environment variables (defaults set in the Dockerfile), so they can be
; changed per container without rebuilding.
expose_php = Off
display_errors = ${PHP_DISPLAY_ERRORS}
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}

; opcache is enabled by the official image, these only tune it.
; Set PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 in production images where the code
; never changes at runtime.
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
